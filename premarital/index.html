<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>婚前辅导表单</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <meta name="theme-color" content="#c27a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <script>
    /* 首屏防闪（置于 head，早于样式计算） */
    (function () {
      try {
        var t = localStorage.getItem('premarital-theme');
        if (!t) {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="top-head">
        <h1>婚前辅导 · 多表单</h1>
        <button class="btn theme-btn" type="button" aria-pressed="false" aria-label="切换夜间/暖色模式" title="切换夜间/暖色模式">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-text"></span>
        </button>
      </div>
      <nav>
        <a class="back-link" href="../">← 返回工具箱</a>
      </nav>
    </div>
    <div class="note">
      数据仅保存在本机浏览器，可离线使用。手机浏览器可「添加到主屏幕」当 App 用；点选表单填写与对照，支持导入导出。
    </div>
    <div id="error" class="error" hidden></div>

    <div class="card">
      <div class="row" id="names"></div>
      <p class="muted" style="margin-top:10px">
        填写称呼后，各表单与对照报告的抬头都会显示名字，导出文件名也会带名字与日期。
      </p>
    </div>

    <div class="card">
      <div class="actions">
        <div class="actions-main">
          <button class="btn primary" id="btn-export" type="button">导出全部 JSON</button>
          <a class="btn" href="premarital-counseling-offline.html" download>下载离线单文件</a>
        </div>
        <div class="actions-tools">
          <label class="btn ghost" for="file-import">导入 JSON</label>
          <input id="file-import" type="file" accept="application/json,.json" hidden />
        </div>
      </div>
      <p class="muted" style="margin-top:10px">
        导入会按文件内标记的身份覆盖对应一侧；未标记的旧包仍按丈夫/妻子两侧合并。
        单张表的「导出本表」导出双方，填写页的「导出本表」只导出你自己那一侧。
      </p>
    </div>

    <div id="form-list"></div>
  </div>
  <script src="js/pwa.js"></script>
  <script type="module" src="js/home.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
