<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>双方对照 · 婚前辅导</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <meta name="theme-color" content="#c27a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <script>
    /* 首屏防闪（置于 head，早于样式计算） */
    (function () {
      try {
        var t = localStorage.getItem('premarital-theme');
        if (!t) {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div class="wrap">
    <div class="top no-print">
      <div class="top-head">
        <h1 id="page-title">双方对照</h1>
        <button class="btn theme-btn" type="button" aria-pressed="false" aria-label="切换夜间/暖色模式" title="切换夜间/暖色模式">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-text"></span>
        </button>
      </div>
      <nav>
        <a class="back-link" href="../">← 返回工具箱</a>
        <a href="index.html">全部表单</a>
        <a href="fill.html?person=a" id="link-fill-a">填丈夫</a>
        <a href="fill.html?person=b" id="link-fill-b">填妻子</a>
      </nav>
    </div>
    <div class="note no-print">绿=一致 · 黄=差1 · 红=差≥2（量表/选择题）。开放题仅并排；单侧未答标「未齐」，可用「仅未齐」筛出。</div>
    <div id="error" class="error" hidden></div>

    <div class="card">
      <div class="row no-print" style="margin-bottom:10px">
        <button class="btn" id="btn-export-form" type="button">导出本表</button>
        <label class="btn" for="file-import-form">导入本表</label>
        <input id="file-import-form" type="file" accept="application/json,.json" hidden />
        <button class="btn primary" id="btn-print-report" type="button">打印报告</button>
      </div>
      <div class="print-report-meta" id="print-meta" hidden></div>
      <div class="summary" id="summary"></div>
      <div class="filters no-print" id="filters">
        <label><input type="radio" name="filter" value="all_answered" /> 全部已填（含未答一侧）</label>
        <label><input type="radio" name="filter" value="diff_only" checked /> 仅差异（双方已答）</label>
        <label><input type="radio" name="filter" value="far_only" /> 仅红（差≥2）</label>
        <label><input type="radio" name="filter" value="missing_only" /> 仅未齐（单侧未答）</label>
      </div>
      <p class="muted no-print" id="print-hint">打印默认按当前筛选（默认「仅差异」）；可勾选是否含开放题与未答题清单。</p>
      <div class="row no-print" style="margin-bottom:10px">
        <label class="check"><input type="checkbox" id="print-include-open" checked /> 打印含开放题</label>
        <label class="check"><input type="checkbox" id="print-include-gaps" checked /> 打印含未答题清单</label>
      </div>
      <div id="list"></div>
    </div>

    <div class="card" id="open-section">
      <h2>开放题并排</h2>
      <p class="muted no-print">不做语义对比，仅并排查看。</p>
      <div id="open-list"></div>
    </div>
    <div class="card" id="gap-section">
      <h2>未答题清单 <span class="muted" id="gap-count"></span></h2>
      <p class="muted no-print">双方都没回答的开放题，方便补充后再交报告。</p>
      <div id="gap-list"></div>
    </div>
    <div class="print-footer" id="print-footer" hidden>
      隐私提示：本报告仅供婚前辅导使用，请勿外传；打印件请自行妥善保管或销毁。
    </div>
  </div>
  <script src="js/pwa.js"></script>

  <script type="module" src="js/compare-page.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
