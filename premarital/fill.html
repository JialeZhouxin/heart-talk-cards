<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>填写 · 婚前辅导</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <meta name="theme-color" content="#c27a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <script>
    /* 首屏防闪（置于 head，早于样式计算） */
    (function () {
      try {
        var t = localStorage.getItem('premarital-theme');
        if (!t) {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="top-head">
        <h1 id="title">填写</h1>
        <button class="btn theme-btn" type="button" aria-pressed="false" aria-label="切换夜间/暖色模式" title="切换夜间/暖色模式">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-text"></span>
        </button>
      </div>
      <nav>
        <a class="back-link" href="../">← 返回工具箱</a>
        <a href="index.html">全部表单</a>
        <a href="compare.html" id="link-compare">对照</a>
      </nav>
    </div>
    <div class="note">自动保存到本机。点选程度前请先看「1–5 含义」；开放题直接输入。</div>
    <div class="row" style="margin-bottom:12px">
      <label class="muted" for="person-name">我的称呼</label>
      <input id="person-name" type="text" maxlength="20" placeholder="如：小明" autocomplete="name"
        style="width:10em;min-height:40px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit" />
      <span class="muted">填上后对照与打印都会显示你的名字</span>
    </div>
    <div id="error" class="error" hidden></div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <button class="btn" id="btn-export-form" type="button">导出本表</button>
        <label class="btn" for="file-import-form">导入本表</label>
        <input id="file-import-form" type="file" accept="application/json,.json" hidden />
      </div>
      <div class="row" style="justify-content:space-between">
        <div id="chapter-title" class="muted"></div>
        <div id="chapter-progress" class="progress"></div>
      </div>
      <div class="chapter-nav" id="chapters-nav"></div>
      <div class="scale-legend" id="scale-legend" hidden></div>
      <div id="items"></div>
      <div class="pager">
        <button class="btn" id="prev" type="button">上一章</button>
        <button class="btn primary" id="next" type="button">下一章</button>
      </div>
    </div>
  </div>
  <script src="js/pwa.js"></script>
  <script type="module" src="js/fill.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
