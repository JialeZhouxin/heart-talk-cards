<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c27a3a">
    <title>我的工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: #f6ecdf;
            color: #3d2f21;
            min-height: 100vh;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
        header { text-align: center; margin-bottom: 36px; }
        header h1 { font-size: 2rem; margin-bottom: 8px; }
        header p { color: #8a7561; }
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .tool-card {
            display: block;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .tool-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .tool-card .icon { font-size: 2.2rem; margin-bottom: 12px; }
        .tool-card h2 { font-size: 1.2rem; margin-bottom: 6px; }
        .tool-card p { font-size: 0.9rem; color: #8a7561; line-height: 1.5; }
        @media (max-width: 520px) { .tool-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ 我的工具箱</h1>
            <p>想用哪个，点哪个</p>
        </header>
        <div class="tool-grid">
            <a class="tool-card" href="./heart-talk/">
                <div class="icon">💌</div>
                <h2>心语卡牌</h2>
                <p>情侣、朋友、家庭深度对话卡牌，抽一张，聊一聊</p>
            </a>
            <a class="tool-card" href="./brain-teaser/">
                <div class="icon">🧠</div>
                <h2>脑筋急转弯</h2>
                <p>随机出题考脑洞，看看你的脑筋转不转得过来</p>
            </a>
        </div>
    </div>
</body>
</html>
